<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Γιάννης - Προσωπικός Βοηθός</title>
    <!-- Three.js για το 3D Avatar -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --user-bubble: #0284c7;
            --assistant-bubble: #334155;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #app-container {
            width: 100%;
            max-width: 750px;
            height: 92vh;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        header {
            padding: 15px 20px;
            background: rgba(15, 23, 42, 0.8);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 10;
        }

        header h2 {
            margin: 0;
            font-size: 18px;
            color: var(--accent);
        }

        .header-info {
            font-size: 13px;
            color: var(--text-muted);
            text-align: right;
            line-height: 1.4;
        }

        /* Κεντρικό section για το μεγάλο 3D Πρόσωπο */
        #avatar-section {
            width: 100%;
            height: 380px;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            position: relative;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        #avatar-canvas-container {
            width: 100%;
            height: 100%;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scroll-behavior: smooth;
            max-height: 200px;
        }

        .message {
            padding: 10px 14px;
            border-radius: 12px;
            max-width: 80%;
            font-size: 14px;
            line-height: 1.4;
        }

        .user { background: var(--user-bubble); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
        .assistant { background: var(--assistant-bubble); color: var(--text-main); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid rgba(255, 255, 255, 0.05); }

        #status-bar {
            padding: 12px 20px;
            background: rgba(15, 23, 42, 0.6);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .pulse-dot {
            width: 12px;
            height: 12px;
            background-color: #ef4444;
            border-radius: 50%;
        }

        .pulse-dot.active {
            background-color: #22c55e;
            box-shadow: 0 0 10px #22c55e;
        }

        #status-text {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <header>
            <h2>✨ Γιάννης AI</h2>
            <div class="header-info" id="headerInfo">
                <div>Πόλη: Εντοπισμός...</div>
                <div>Υπόλοιπο: <span id="remainingTokens">10000</span> | Τραβήχτηκαν: <span id="currentTokens">0</span></div>
            </div>
        </header>

        <!-- Μεγάλο 3D Πρόσωπο -->
        <div id="avatar-section">
            <div id="avatar-canvas-container"></div>
        </div>

        <div id="messages"></div>

        <div id="status-bar">
            <div class="pulse-dot" id="pulseDot"></div>
            <div id="status-text">Περιμένω τη λέξη «Γιάννη»...</div>
        </div>
    </div>

    <script>
        // --- 3D LARGE HUMAN FACE AVATAR SETUP (Three.js) ---
        const container = document.getElementById("avatar-canvas-container");
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        // Φωτισμός
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
        scene.add(ambientLight);

        const frontLight = new THREE.DirectionalLight(0x38bdf8, 1.2);
        frontLight.position.set(0, 2, 5);
        scene.add(frontLight);

        const backLight = new THREE.PointLight(0x0284c7, 2, 10);
        backLight.position.set(0, -2, -2);
        scene.add(backLight);

        // Ομάδα κεφαλιού
        const headGroup = new THREE.Group();

        // Κύριο κρανίο / πρόσωπο (ελαφρώς πεπλατυσμένο μπροστά για ανθρώπινη αίσθηση)
        const faceGeo = new THREE.SphereGeometry(1.3, 32, 32);
        faceGeo.scale(1, 1.3, 1.1);
        const faceMat = new THREE.MeshStandardMaterial({ 
            color: 0x283548, 
            roughness: 0.35, 
            metalness: 0.25 
        });
        const faceMesh = new THREE.Mesh(faceGeo, faceMat);
        headGroup.add(faceMesh);

        // Αυτιά
        const earGeo = new THREE.CylinderGeometry(0.25, 0.2, 0.5, 16);
        earGeo.rotateZ(Math.PI / 2);
        const earMat = new THREE.MeshStandardMaterial({ color: 0x222d3d, roughness: 0.5 });
        
        const leftEar = new THREE.Mesh(earGeo, earMat);
        leftEar.position.set(-1.25, 0.1, 0);
        headGroup.add(leftEar);

        const rightEar = new THREE.Mesh(earGeo, earMat);
        rightEar.position.set(1.25, 0.1, 0);
        headGroup.add(rightEar);

        // Μάτια (Βολβοί & Ίριδες)
        const eyeBgGeo = new THREE.SphereGeometry(0.22, 16, 16);
        const eyeBgMat = new THREE.MeshStandardMaterial({ color: 0xffffff });

        const irisGeo = new THREE.SphereGeometry(0.12, 16, 16);
        const irisMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7, emissiveIntensity: 0.5 });

        // Αριστερό Μάτι
        const leftEyeGroup = new THREE.Group();
        const lBg = new THREE.Mesh(eyeBgGeo, eyeBgMat);
        const lIris = new THREE.Mesh(irisGeo, irisMat);
        lIris.position.set(0, 0, 0.12);
        leftEyeGroup.add(lBg, lIris);
        leftEyeGroup.position.set(-0.45, 0.35, 1.05);
        headGroup.add(leftEyeGroup);

        // Δεξί Μάτι
        const rightEyeGroup = new THREE.Group();
        const rBg = new THREE.Mesh(eyeBgGeo, eyeBgMat);
        const rIris = new THREE.Mesh(irisGeo, irisMat);
        rIris.position.set(0, 0, 0.12);
        rightEyeGroup.add(rBg, rIris);
        rightEyeGroup.position.set(0.45, 0.35, 1.05);
        headGroup.add(rightEyeGroup);

        // Φρύδια
        const browGeo = new THREE.BoxGeometry(0.4, 0.07, 0.1);
        const browMat = new THREE.MeshStandardMaterial({ color: 0x1e293b });
        
        const leftBrow = new THREE.Mesh(browGeo, browMat);
        leftBrow.position.set(-0.45, 0.65, 1.15);
        leftBrow.rotation.z = -0.08;
        headGroup.add(leftBrow);

        const rightBrow = new THREE.Mesh(browGeo, browMat);
        rightBrow.position.set(0.45, 0.65, 1.15);
        rightBrow.rotation.z = 0.08;
        headGroup.add(rightBrow);

        // Μύτη
        const noseGeo = new THREE.ConeGeometry(0.15, 0.4, 16);
        noseGeo.rotateX(Math.PI / 2);
        const noseMat = new THREE.MeshStandardMaterial({ color: 0x222d3d, roughness: 0.4 });
        const nose = new THREE.Mesh(noseGeo, noseMat);
        nose.position.set(0, 0.05, 1.25);
        headGroup.add(nose);

        // Στόμα (για δυναμικό Lip-sync animation)
        const mouthGeo = new THREE.BoxGeometry(0.6, 0.12, 0.2);
        const mouthMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.8 });
        const mouthMesh = new THREE.Mesh(mouthGeo, mouthMat);
        mouthMesh.position.set(0, -0.5, 1.15);
        headGroup.add(mouthMesh);

        scene.add(headGroup);
        camera.position.z = 4.0;

        let clock = new THREE.Clock();
        let isTalking = false;

        // Render Loop & Animation
        function animateAvatar() {
            requestAnimationFrame(animateAvatar);
            const elapsedTime = clock.getElapsedTime();

            // Φυσική ήπια κίνηση κεφαλιού (idle breathing / floating)
            headGroup.rotation.y = Math.sin(elapsedTime * 1.2) * 0.12;
            headGroup.rotation.x = Math.cos(elapsedTime * 1.0) * 0.06;

            // Αν ο βοηθός μιλάει, το στόμα ανοιγοκλείνει ρυθμικά
            if (isTalking) {
                mouthMesh.scale.y = 1 + Math.abs(Math.sin(elapsedTime * 22)) * 3.5;
            } else {
                mouthMesh.scale.y = 1; // Κανονικό κλειστό στόμα
            }

            renderer.render(scene, camera);
        }
        animateAvatar();
        // ----------------------------------------------------

        const messagesDiv = document.getElementById("messages");
        const statusText = document.getElementById("status-text");
        const pulseDot = document.getElementById("pulseDot");
        const remainingTokensEl = document.getElementById("remainingTokens");
        const currentTokensEl = document.getElementById("currentTokens");
        const headerInfo = document.getElementById("headerInfo");

        const INITIAL_LIMIT = 10000;
        let savedRemaining = localStorage.getItem('giannis_remaining_tokens');
        let totalRemainingTokens = savedRemaining !== null ? parseInt(savedRemaining) : INITIAL_LIMIT;

        let userLocation = null;
        let detectedCity = "Κόρινθος";
        let isListeningActive = false;
        let isWaitingForCommand = false;
        let isAssistantSpeaking = false;
        let conversationHistory = [];
        let recognition = null;
        let selectedVoice = null;

        function loadVoices() {
            const voices = window.speechSynthesis.getVoices();
            selectedVoice = voices.find(v => v.lang.includes('el') && (v.name.includes('Natural') || v.name.includes('Google'))) || voices.find(v => v.lang.includes('el')) || voices[0];
        }
        window.speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices();

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async (pos) => {
                userLocation = { lat: pos.coords.latitude, lon: pos.coords.longitude };
                try {
                    const res = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${userLocation.lat}&lon=${userLocation.lon}&accept-language=el`;
                    const data = await (await fetch(res)).json();
                    detectedCity = data.address.city || data.address.town || data.address.village || "Κόρινθος";
                } catch (e) {}
                updateTokenUI(0);
            }, () => { updateTokenUI(0); });
        }

        function updateTokenUI(latestUsage = 0) {
            remainingTokensEl.innerText = totalRemainingTokens;
            currentTokensEl.innerText = latestUsage;
            headerInfo.children[0].innerText = `Πόλη: ${detectedCity}`;
        }
        updateTokenUI(0);

        function appendMessage(role, text) {
            const className = role === 'user' ? 'user' : 'assistant';
            messagesDiv.innerHTML += `<div class="message ${className}">${text}</div>`;
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function stopEverything() {
            window.speechSynthesis.cancel();
            isAssistantSpeaking = false;
            isTalking = false;
            isListeningActive = false;
            isWaitingForCommand = false;
            pulseDot.classList.remove('active');
            statusText.innerText = "Περιμένω τη λέξη «Γιάννη»...";
        }

        function speak(text, callback) {
            window.speechSynthesis.cancel();
            isAssistantSpeaking = true;
            isTalking = true; // Ενεργοποίηση κίνησης στόματος στο 3D πρόσωπο
            pulseDot.classList.remove('active');
            statusText.innerText = "Ο Γιάννης μιλάει...";

            if (recognition) {
                try { recognition.stop(); } catch (e) {}
            }

            const utterance = new SpeechSynthesisUtterance(text);
            if (selectedVoice) utterance.voice = selectedVoice;
            utterance.lang = 'el-GR';
            utterance.rate = 1.05;

            let isFinished = false;

            const finishSpeech = () => {
                if (isFinished) return;
                isFinished = true;
                isAssistantSpeaking = false;
                isTalking = false; // Σταμάτημα κίνησης στόματος

                if (recognition) {
                    try { recognition.start(); } catch (e) {}
                }

                if (isListeningActive) {
                    pulseDot.classList.add('active');
                    statusText.innerText = "Ενεργός - Περιμένω την ερώτησή σου...";
                    isWaitingForCommand = true;
                } else {
                    pulseDot.classList.remove('active');
                    statusText.innerText = "Περιμένω τη λέξη «Γιάννη»...";
                    isWaitingForCommand = false;
                }
                if (callback) callback();
            };

            utterance.onend = finishSpeech;
            utterance.onerror = finishSpeech;

            window.speechSynthesis.speak(utterance);
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("Ο browser σου δεν υποστηρίζει φωνητική αναγνώριση.");
        } else {
            recognition = new SpeechRecognition();
            recognition.lang = 'el-GR';
            recognition.continuous = true;
            recognition.interimResults = false;

            recognition.onresult = async (event) => {
                if (isAssistantSpeaking) return;

                const speechResult = event.results[event.results.length - 1][0].transcript.trim().toLowerCase();
                
                if (!speechResult || speechResult.length < 2) return;

                if (speechResult.includes("σταμάτα") || speechResult.includes("στοπ")) {
                    stopEverything();
                    speak("Εντάξει, σταματάω.");
                    return;
                }

                if (!isListeningActive) {
                    if (speechResult.includes("γιάννη") || speechResult.includes("γιάννης")) {
                        isListeningActive = true;
                        isWaitingForCommand = true;
                        pulseDot.classList.add('active');
                        statusText.innerText = 'Ενεργός - Περιμένω την ερώτησή σου...';
                        speak("Ακούω");
                    }
                    return;
                }

                if (isListeningActive && isWaitingForCommand) {
                    if (speechResult === "γιάννη" || speechResult === "γιάννης" || speechResult === "ακούω") {
                        return; 
                    }

                    isWaitingForCommand = false;
                    appendMessage('user', speechResult);
                    conversationHistory.push({ role: "user", content: speechResult });
                    statusText.innerText = "Σκέφτομαι...";
                    pulseDot.classList.remove('active');

                    try {
                        const res = await fetch('/api/chat', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ messages: conversationHistory, location: userLocation })
                        });
                        const data = await res.json();

                        let promptTokens = 0;
                        if (data.usage && data.usage.total_tokens) {
                            promptTokens = data.usage.total_tokens;
                            totalRemainingTokens = Math.max(0, totalRemainingTokens - promptTokens);
                            localStorage.setItem('giannis_remaining_tokens', totalRemainingTokens);
                            updateTokenUI(promptTokens);
                        }

                        appendMessage('assistant', data.reply);
                        conversationHistory.push({ role: "assistant", content: data.reply });

                        speak(data.reply);
                    } catch (err) {
                        statusText.innerText = "Σφάλμα σύνδεσης.";
                        isWaitingForCommand = true;
                    }
                }
            };

            recognition.onend = () => {
                if (!isAssistantSpeaking) {
                    try { recognition.start(); } catch (e) {}
                }
            };

            try {
                recognition.start();
                statusText.innerText = "Περιμένω τη λέξη «Γιάννη»...";
            } catch (e) {}
        }
    </script>
</body>
</html>
