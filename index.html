<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Γιάννης Assistant</title>

<style>
body{
background:#111827;
color:white;
font-family:Arial;
margin:0;
padding:20px;
}

#status{
font-size:22px;
margin-bottom:20px;
}

#heard{
color:#60a5fa;
margin-bottom:20px;
}

#messages{
height:70vh;
overflow:auto;
border:1px solid #374151;
padding:10px;
border-radius:10px;
}

.user{
background:#2563eb;
padding:10px;
margin:5px;
border-radius:8px;
}

.assistant{
background:#374151;
padding:10px;
margin:5px;
border-radius:8px;
}
</style>

</head>
<body>

<h1>Γιάννης</h1>

<div id="status">
Περιμένω τη λέξη "Γιάννη"
</div>

<div id="heard"></div>

<div id="messages"></div>

<script>

const statusDiv = document.getElementById("status");
const heardDiv = document.getElementById("heard");
const messagesDiv = document.getElementById("messages");

let active = false;
let processing = false;
let speaking = false;

let history = [];

let city = "";

async function loadLocation() {
  try {

    const pos = await new Promise((resolve,reject)=>{
      navigator.geolocation.getCurrentPosition(resolve,reject);
    });

    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;

    const r = await fetch(
      `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`
    );

    const data = await r.json();

    city =
      data.address.city ||
      data.address.town ||
      data.address.village ||
      "";

  } catch(e){
    console.log(e);
  }
}

loadLocation();

function addMessage(role,text){

  const div=document.createElement("div");

  div.className=role;

  div.textContent=text;

  messagesDiv.appendChild(div);

  messagesDiv.scrollTop=messagesDiv.scrollHeight;
}

function speak(text){

  speaking=true;

  const u = new SpeechSynthesisUtterance(text);

  u.lang="el-GR";

  u.onend=()=>{
    speaking=false;
  };

  speechSynthesis.speak(u);
}

function normalize(text){

  return text
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/ς/g,"σ");
}

function isWakeWord(text){

  const t=normalize(text);

  return t.includes("γιαννη");
}

function isStop(text){

  const t=normalize(text);

  return (
    t.includes("στοπ") ||
    t.includes("σταματα") ||
    t.includes("σταματα")
  );
}

async function askAI(message){

  if(processing) return;

  processing=true;

  addMessage("user",message);

  history.push({
    role:"user",
    content:message
  });

  try{

    const response=await fetch("/api/chat",{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        messages:history.slice(-10)
      })
    });

    const data=await response.json();

    addMessage("assistant",data.reply);

    history.push({
      role:"assistant",
      content:data.reply
    });

    speak(data.reply);

  }catch(e){

    speak("Παρουσιάστηκε σφάλμα.");

  }

  processing=false;
}

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!SpeechRecognition){

  statusDiv.textContent =
  "Ο browser δεν υποστηρίζει Speech Recognition";

}else{

  const recognition=new SpeechRecognition();

  recognition.lang="el-GR";

  recognition.continuous=true;

  recognition.interimResults=false;

  recognition.onresult=async(event)=>{

    if(speaking) return;

    const text=
    event.results[event.results.length-1][0].transcript;

    heardDiv.textContent=text;

    const n=normalize(text);

    if(isStop(n)){

      active=false;

      speak("Εντάξει. Σταματάω.");

      statusDiv.textContent=
      'Περιμένω τη λέξη "Γιάννη"';

      return;
    }

    if(!active){

      if(isWakeWord(text)){

        active=true;

        statusDiv.textContent="Σε ακούω";

        speak("Σε ακούω");

      }

      return;
    }

    if(
      n.includes("τι ωρα") ||
      n.includes("ωρα ειναι")
    ){

      const answer =
      "Η ώρα είναι " +
      new Date().toLocaleTimeString(
      "el-GR",
      {
        hour:"2-digit",
        minute:"2-digit"
      });

      addMessage("assistant",answer);

      speak(answer);

      return;
    }

    if(
      n.includes("ημερομηνια")
    ){

      const answer =
      "Σήμερα είναι " +
      new Date().toLocaleDateString(
      "el-GR",
      {
        weekday:"long",
        year:"numeric",
        month:"long",
        day:"numeric"
      });

      addMessage("assistant",answer);

      speak(answer);

      return;
    }

    if(
      n.includes("σε ποια πολη ειμαι") ||
      n.includes("που βρισκομαι")
    ){

      const answer =
      city
      ? `Βρίσκεσαι στην ${city}`
      : "Δεν γνωρίζω ακόμη την τοποθεσία σου.";

      addMessage("assistant",answer);

      speak(answer);

      return;
    }

    askAI(text);
  };

  recognition.onend=()=>{
    recognition.start();
  };

  recognition.start();
}

</script>

</body>
</html>
