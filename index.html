<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Γιάννης - Φωνητικός Βοηθός</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #chat-container {
            width: 100%;
            max-width: 600px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        #messages {
            height: 300px;
            overflow-y: auto;
            border: 1px solid #333;
            padding: 10px;
            border-radius: 8px;
            background: #181818;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .message {
            padding: 8px 12px;
            border-radius: 6px;
            max-width: 80%;
            font-size: 14px;
        }
        .user { background: #0056b3; align-self: flex-end; }
        .assistant { background: #333; align-self: flex-start; }
        #status {
            font-size: 15px;
            text-align: center;
            padding: 8px;
            background: #2a2a2a;
            border-radius: 6px;
            color: #00ffcc;
        }
        .counter {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: #00ffcc;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #00ffcc;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="counter" id="counterDisplay">Tokens: 0 | Πόλη: Εντοπισμός...</div>

    <div id="chat-container">
        <h2>🎙️ Γιάννης AI</h2>
        <div id="messages"></div>
        <div id="status">Περιμένω τη λέξη «Γιάννη»...</div>
    </div>

    <script>
        const messagesDiv = document.getElementById("messages");
        const statusDiv = document.getElementById("status");
        const counterDisplay = document.getElementById("counterDisplay");

        let totalTokens = 0;
        let userLocation = null;
        let detectedCity = "Κόρινθος";
        let isListeningActive = false;
        let isAssistantSpeaking = false;
        let conversationHistory = [];
        let recognition = null;

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async (pos) => {
                userLocation = { lat: pos.coords.latitude, lon: pos.coords.longitude };
                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${userLocation.lat}&lon=${userLocation.lon}&accept-language=el`);
                    const data = await res.json();
                    detectedCity = data.address.city || data.address.town || data.address.village || "Κόρινθος";
                } catch (e) {}
                updateCounter();
            }, () => { updateCounter(); });
        }

        function updateCounter() {
            counterDisplay.innerText = `Tokens: ${totalTokens} | Πόλη: ${detectedCity}`;
        }

        function appendMessage(role, text) {
            const className = role === 'user' ? 'user' : 'assistant';
            messagesDiv.innerHTML += `<div class="message ${className}">${text}</div>`;
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function speak(text, callback) {
            window.speechSynthesis.cancel();
            isAssistantSpeaking = true;

            // Κλείνουμε τελείως το μικρόφωνο ώστε να μην ακούει τίποτα ενώ μιλάει ο Γιάννης
            if (recognition) {
                try { recognition.stop(); } catch (e) {}
            }

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'el-GR';
            utterance.rate = 1.0;
            
            utterance.onend = () => {
                // Περιμένουμε 1 ολόκληρο δευτερόλεπτο αφού τελειώσει η ομιλία πριν ξανανάψουμε το μικρόφωνο
                setTimeout(() => {
                    isAssistantSpeaking = false;
                    if (recognition) {
                        try { recognition.start(); } catch (e) {}
                    }
                    if (callback) callback();
                }, 1000);
            };

            window.speechSynthesis.speak(utterance);
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("Ο browser σου δεν υποστηρίζει φωνητική αναγνώριση.");
        } else {
            recognition = new SpeechRecognition();
            recognition.lang = 'el-GR';
            recognition.continuous = true;
            recognition.interimResults = false;

            recognition.onresult = async (event) => {
                if (isAssistantSpeaking) return;

                const speechResult = event.results[event.results.length - 1][0].transcript.trim().toLowerCase();
                
                if (speechResult.includes("σταμάτα") || speechResult.includes("στοπ")) {
                    isListeningActive = false;
                    statusDiv.innerText = 'Περιμένω τη λέξη «Γιάννη»...';
                    speak("Εντάξει, σταματάω.");
                    return;
                }

                if (!isListeningActive) {
                    if (speechResult.includes("γιάννη") || speechResult.includes("γιάννης")) {
                        isListeningActive = true;
                        statusDiv.innerText = 'Ενεργός - Ακούω...';
                        speak("Ναι, εδώ είμαι. Τι θες;");
                    }
                } else {
                    appendMessage('user', speechResult);
                    conversationHistory.push({ role: "user", content: speechResult });
                    statusDiv.innerText = "Σκέφτομαι...";

                    try {
                        const res = await fetch('/api/chat', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ messages: conversationHistory, location: userLocation })
                        });
                        const data = await res.json();

                        if (data.usage && data.usage.total_tokens) {
                            totalTokens += data.usage.total_tokens;
                            updateCounter();
                        }

                        appendMessage('assistant', data.reply);
                        conversationHistory.push({ role: "assistant", content: data.reply });

                        statusDiv.innerText = "Ακούω...";
                        speak(data.reply);
                    } catch (err) {
                        statusDiv.innerText = "Σφάλμα σύνδεσης.";
                    }
                }
            };

            recognition.onend = () => {
                if (!isAssistantSpeaking) {
                    try { recognition.start(); } catch (e) {}
                }
            };

            try {
                recognition.start();
                statusDiv.innerText = "Περιμένω τη λέξη «Γιάννη»...";
            } catch (e) {}
        }
    </script>
</body>
</html>
