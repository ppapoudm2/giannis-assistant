<!-- public/index.html - Πλήρης κώδικας frontend με Live Token Counter και Εντοπισμό Πόλης -->
<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Γιάννης - Assistant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #chat-container {
            width: 100%;
            max-width: 600px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        #messages {
            height: 350px;
            overflow-y: auto;
            border: 1px solid #333;
            padding: 10px;
            border-radius: 5px;
            background: #181818;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .message {
            padding: 8px 12px;
            border-radius: 6px;
            max-width: 80%;
        }
        .user { background: #0056b3; align-self: flex-end; }
        .assistant { background: #333; align-self: flex-start; }
        .input-area {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #fff;
        }
        button {
            padding: 10px 20px;
            border: none;
            background: #00ffcc;
            color: #000;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover { background: #00b38f; }
    </style>
</head>
<body>

    <div id="chat-container">
        <h2>Γιάννης AI</h2>
        <div id="messages"></div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Πληκτρολόγησε μήνυμα...">
            <button onclick="sendMessage()">Αποστολή</button>
        </div>
    </div>

    <script>
        // --- Live Token Counter & City Detection UI ---
        const tokenDisplay = document.createElement("div");
        tokenDisplay.id = "token-counter";
        tokenDisplay.style.position = "fixed";
        tokenDisplay.style.top = "10px";
        tokenDisplay.style.right = "10px";
        tokenDisplay.style.background = "rgba(0, 0, 0, 0.8)";
        tokenDisplay.style.color = "#00ffcc";
        tokenDisplay.style.padding = "8px 14px";
        tokenDisplay.style.borderRadius = "8px";
        tokenDisplay.style.fontSize = "12px";
        tokenDisplay.style.zIndex = "9999";
        tokenDisplay.style.border = "1px solid #00ffcc";
        tokenDisplay.innerHTML = "Tokens: 0 | Πόλη: Εντοπισμός...";
        document.body.appendChild(tokenDisplay);

        let totalSessionTokens = 0;
        window.currentDetectedCity = "Κόρινθος"; // Default fallback

        function updateTokenUI(usage, city) {
            if (usage && usage.total_tokens) {
                totalSessionTokens += usage.total_tokens;
            }
            const activeCity = city || window.currentDetectedCity;
            tokenDisplay.innerHTML = `Tokens: ${totalSessionTokens} (Τελευταίο: ${usage ? usage.total_tokens : 0}) | Πόλη: ${activeCity}`;
        }

        // Αυτόματος εντοπισμός πόλης μέσω Geolocation
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=el`);
                    const data = await res.json();
                    const city = data.address.city || data.address.town || data.address.village || data.address.county || "Κόρινθος";
                    window.currentDetectedCity = city;
                    updateTokenUI(null, city);
                } catch (e) {
                    updateTokenUI(null, "Κόρινθος");
                }
            }, () => {
                updateTokenUI(null, "Κόρινθος");
            });
        } else {
            updateTokenUI(null, "Κόρινθος");
        }

        // --- Λειτουργία αποστολής μηνύματος ---
        async function sendMessage() {
            const inputField = document.getElementById("userInput");
            const messageText = inputField.value.trim();
            if (!messageText) return;

            const messagesDiv = document.getElementById("messages");
            messagesDiv.innerHTML += `<div class="message user">${messageText}</div>`;
            inputField.value = "";
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: messageText })
                });

                const data = await response.json();
                
                if (data.reply) {
                    messagesDiv.innerHTML += `<div class="message assistant">${data.reply}</div>`;
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                }

                // Ενημέρωση των tokens live στην οθόνη
                if (data.usage) {
                    updateTokenUI(data.usage, window.currentDetectedCity);
                }

            } catch (error) {
                messagesDiv.innerHTML += `<div class="message assistant" style="color:red;">Σφάλμα σύνδεσης.</div>`;
            }
        }

        // Υποστήριξη Enter στο input
        document.getElementById("userInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });
    </script>
</body>
</html>
