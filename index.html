<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Γιάννης - Φωνητικός Βοηθός</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #container {
            width: 100%;
            max-width: 500px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            text-align: center;
        }
        #status {
            font-size: 18px;
            margin: 20px 0;
            padding: 10px;
            background: #2a2a2a;
            border-radius: 8px;
            border: 1px solid #444;
        }
        #info {
            font-size: 14px;
            color: #00ffcc;
            margin-top: 10px;
        }
        .counter {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: #00ffcc;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #00ffcc;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="counter" id="counterDisplay">Tokens: 0 | Πόλη: Εντοπισμός...</div>

    <div id="container">
        <h2>🎙️ Γιάννης AI</h2>
        <div id="status">Περιμένω τη λέξη «Γιάννη»...</div>
        <div id="info">Πες «Γιάννη» για να ξεκινήσεις, ή «σταμάτα» για παύση.</div>
    </div>

    <script>
        const statusDiv = document.getElementById("status");
        const counterDisplay = document.getElementById("counterDisplay");

        let totalTokens = 0;
        let userLocation = null;
        let detectedCity = "Κόρινθος";
        let isListeningActive = false;

        // 1. Αυτόματος εντοπισμός τοποθεσίας (Στίγμα) με το άνοιγμα
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async (pos) => {
                userLocation = { lat: pos.coords.latitude, lon: pos.coords.longitude };
                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${userLocation.lat}&lon=${userLocation.lon}&accept-language=el`);
                    const data = await res.json();
                    detectedCity = data.address.city || data.address.town || data.address.village || "Κόρινθος";
                } catch (e) {}
                updateUI("Περιμένω τη λέξη «Γιάννη»...");
            }, () => {
                updateUI("Περιμένω τη λέξη «Γιάννη»...");
            });
        }

        function updateUI(text) {
            statusDiv.innerText = text;
            counterDisplay.innerText = `Tokens: ${totalTokens} | Πόλη: ${detectedCity}`;
        }

        // 2. Συνθεση Φωνής (Text-to-Speech)
        function speak(text, callback) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'el-GR';
            utterance.rate = 1.0;
            utterance.onend = () => {
                if (callback) callback();
            };
            window.speechSynthesis.speak(utterance);
        }

        // 3. Αναγνώριση Ομιλίας (Speech Recognition)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("Ο browser σου δεν υποστηρίζει φωνητική αναγνώριση. Δοκίμασε σε Google Chrome.");
        } else {
            const recognition = new SpeechRecognition();
            recognition.lang = 'el-GR';
            recognition.continuous = true;
            recognition.interimResults = false;

            recognition.onresult = async (event) => {
                const speechResult = event.results[event.results.length - 1][0].transcript.trim().toLowerCase();
                console.log("Άκουσα:", speechResult);

                // Έλεγχος για εντολή "σταμάτα"
                if (speechResult.includes("σταμάτα") || speechResult.includes("στοπ")) {
                    isListeningActive = false;
                    speak("Εντάξει, σταματάω.", () => {
                        updateUI("Περιμένω τη λέξη «Γιάννη»...");
                    });
                    return;
                }

                // Αν δεν είμαστε σε ενεργή συνομιλία, ψάχνουμε το Hot Word ("γιάννη" ή "γιάννης")
                if (!isListeningActive) {
                    if (speechResult.includes("γιάννη") || speechResult.includes("γιάννης")) {
                        isListeningActive = true;
                        speak("Ναι, εδώ είμαι. Τι θες;", () => {
                            updateUI("Ακούω την ερώτησή σου...");
                        });
                    }
                } else {
                    // Ενεργή συνομιλία: Στέλνουμε την ερώτηση στον server
                    updateUI("Σκέφτομαι...");
                    try {
                        const res = await fetch('/api/chat', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ message: speechResult, location: userLocation })
                        });
                        const data = await res.json();

                        if (data.usage && data.usage.total_tokens) {
                            totalTokens += data.usage.total_tokens;
                        }

                        updateUI(`Εσείς: "${speechResult}"\nΓιάννης: "${data.reply}"`);
                        speak(data.reply, () => {
                            if (isListeningActive) updateUI("Συνεχίζω να ακούω...");
                        });
                    } catch (err) {
                        speak("Υπήρξε κάποιο σφάλμα σύνδεσης.");
                        updateUI("Σφάλμα σύνδεσης.");
                    }
                }
            };

            recognition.onerror = (event) => {
                console.log("Σφάλμα μικροφώνου:", event.error);
            };

            recognition.onend = () => {
                // Αυτόματη επανεκκίνηση του recognition για να μην κλείνει ποτέ το μικρόφωνο
                try {
                    recognition.start();
                } catch (e) {}
            };

            // Ξεκινάει αυτόματα με το που ανοίγει η σελίδα
            try {
                recognition.start();
                updateUI("Ζητήθηκε μικρόφωνο. Περιμένω «Γιάννη»...");
            } catch (e) {
                console.log(e);
            }
        }
    </script>
</body>
</html>
