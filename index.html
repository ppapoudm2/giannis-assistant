<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Γιάννης Assistant</title>

<style>
body{
    margin:0;
    background:#111827;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    padding:20px;
    background:#1f2937;
    text-align:center;
    font-size:28px;
    font-weight:bold;
}

#status{
    padding:15px;
    font-size:20px;
    text-align:center;
    color:#60a5fa;
}

#heard{
    padding:10px;
    text-align:center;
    color:#93c5fd;
}

#messages{
    height:70vh;
    overflow-y:auto;
    padding:15px;
}

.user{
    background:#2563eb;
    padding:12px;
    margin:8px;
    border-radius:10px;
}

.assistant{
    background:#374151;
    padding:12px;
    margin:8px;
    border-radius:10px;
}
</style>
</head>

<body>

<header>Γιάννης</header>

<div id="status">
Περιμένω τη λέξη "Γιάννη"
</div>

<div id="heard"></div>

<div id="messages"></div>

<script>

const statusDiv = document.getElementById("status");
const heardDiv = document.getElementById("heard");
const messagesDiv = document.getElementById("messages");

let assistantActive = false;
let assistantSpeaking = false;
let processing = false;
let history = [];
let city = "";

function normalize(text){

    return String(text || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/ς/g,"σ")
    .trim();

}

function addMessage(role,text){

    const div=document.createElement("div");

    div.className=role;
    div.textContent=text;

    messagesDiv.appendChild(div);

    messagesDiv.scrollTop=
    messagesDiv.scrollHeight;

}

function speak(text){

    speechSynthesis.cancel();

    assistantSpeaking=true;

    const voiceText=
    new SpeechSynthesisUtterance(text);

    voiceText.lang="el-GR";
    voiceText.rate=1;

    voiceText.onend=()=>{

        assistantSpeaking=false;

        if(assistantActive){
            statusDiv.textContent="Σε ακούω...";
        }

    };

    speechSynthesis.speak(voiceText);

}

async function loadLocation(){

    try{

        const pos=
        await new Promise(
            (resolve,reject)=>
            navigator.geolocation.getCurrentPosition(
                resolve,
                reject
            )
        );

        const lat=
        pos.coords.latitude;

        const lon=
        pos.coords.longitude;

        const res=
        await fetch(
        `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`
        );

        const data=
        await res.json();

        city=
        data?.address?.city ||
        data?.address?.town ||
        data?.address?.village ||
        "";

    }catch(error){

        console.log(error);

    }

}

loadLocation();

function isWakeWord(text){

    const t=normalize(text);

    return (
        t.includes("γιαννη") ||
        t.includes("γιαννης") ||
        t.includes("γιανη") ||
        t.includes("γιαννι")
    );

}

function isStop(text){

    const t=normalize(text);

    return (
        t.includes("στοπ") ||
        t.includes("σταματα") ||
        t.includes("σταματησε")
    );

}

async function askAI(question){

    if(processing) return;

    processing=true;

    addMessage("user",question);

    history.push({
        role:"user",
        content:question
    });

    try{

        const response=
        await fetch("/api/chat",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                messages:history.slice(-10)
            })

        });

        const data=
        await response.json();

        const reply=
        data.reply ||
        "Δεν έχω απάντηση.";

        addMessage(
            "assistant",
            reply
        );

        history.push({
            role:"assistant",
            content:reply
        });

        speak(reply);

    }catch(error){

        console.log(error);

        speak(
        "Παρουσιάστηκε σφάλμα."
        );

    }

    processing=false;

}

function handleLocalCommands(text){

    const t=normalize(text);

    if(
        t.includes("τι ωρα ειναι") ||
        t.includes("ωρα εχουμε")
    ){

        const answer=
        "Η ώρα είναι " +
        new Date().toLocaleTimeString(
            "el-GR",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

        addMessage(
            "assistant",
            answer
        );

        speak(answer);

        return true;
    }

    if(
        t.includes("ημερομηνια") ||
        t.includes("τι μερα ειναι")
    ){

        const answer=
        "Σήμερα είναι " +
        new Date().toLocaleDateString(
            "el-GR",
            {
                weekday:"long",
                day:"numeric",
                month:"long",
                year:"numeric"
            }
        );

        addMessage(
            "assistant",
            answer
        );

        speak(answer);

        return true;
    }

    if(
        t.includes("που βρισκομαι") ||
        t.includes("σε ποια πολη ειμαι")
    ){

        const answer=
        city
        ? `Βρίσκεσαι στην ${city}`
        : "Δεν γνωρίζω ακόμη την τοποθεσία σου.";

        addMessage(
            "assistant",
            answer
        );

        speak(answer);

        return true;
    }

    return false;

}

const SpeechRecognition=
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!SpeechRecognition){

    statusDiv.textContent=
    "Ο browser δεν υποστηρίζει φωνητική αναγνώριση.";

}else{

    const recognition=
    new SpeechRecognition();

    recognition.lang="el-GR";

    recognition.continuous=true;

    recognition.interimResults=false;

    recognition.onresult=
    async (event)=>{

        if(assistantSpeaking){
            return;
        }

        const text=
        event.results[
            event.results.length-1
        ][0].transcript;

        heardDiv.textContent=
        "Άκουσα: " + text;

        if(isStop(text)){

            speak(
            "Ναι, σταματάω."
            );

            setTimeout(()=>{

                assistantActive=
                false;

                statusDiv.textContent=
                'Περιμένω τη λέξη "Γιάννη"';

            },1500);
