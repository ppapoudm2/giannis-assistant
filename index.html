<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Γιάννης - Προσωπικός Βοηθός</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --user-bubble: #0284c7;
            --assistant-bubble: #334155;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #app-container {
            width: 100%;
            max-width: 750px;
            height: 92vh;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        #avatar-section {
            width: 100%;
            height: 420px;
            background: radial-gradient(
                circle at center,
                #1e293b 0%,
                #0f172a 100%
            );
            position: relative;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        #avatar-canvas-container {
            width: 100%;
            height: 100%;
        }

        #microphone-control {
            position: absolute;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%);
            z-index: 10;
        }

        #micButton {
            border: none;
            border-radius: 999px;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            color: white;
            background: #0284c7;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.35);
            transition: 0.2s ease;
        }

        #micButton:hover {
            transform: scale(1.04);
        }

        #micButton.active {
            background: #16a34a;
            box-shadow: 0 0 18px rgba(34, 197, 94, 0.45);
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scroll-behavior: smooth;
            max-height: 180px;
        }

        .message {
            padding: 10px 14px;
            border-radius: 12px;
            max-width: 80%;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .user {
            background: var(--user-bubble);
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .assistant {
            background: var(--assistant-bubble);
            color: var(--text-main);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        #status-bar {
            padding: 14px 20px;
            background: rgba(15, 23, 42, 0.6);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .pulse-dot {
            width: 12px;
            height: 12px;
            min-width: 12px;
            background-color: #ef4444;
            border-radius: 50%;
        }

        .pulse-dot.active {
            background-color: #22c55e;
            box-shadow: 0 0 10px #22c55e;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.25);
                opacity: 0.65;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        #status-text {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
        }

        @media (max-width: 600px) {
            body {
                min-height: 100dvh;
            }

            #app-container {
                height: 100dvh;
                max-width: none;
                border-radius: 0;
            }

            #avatar-section {
                height: 46vh;
                min-height: 280px;
            }

            #messages {
                max-height: 24vh;
            }
        }
    </style>
</head>

<body>

<div id="app-container">

    <div id="avatar-section">

        <div id="avatar-canvas-container"></div>

        <div id="microphone-control">
            <button id="micButton">
                🎙️ Ενεργοποίηση μικροφώνου
            </button>
        </div>

    </div>

    <div id="messages"></div>

    <div id="status-bar">
        <div class="pulse-dot" id="pulseDot"></div>

        <div id="status-text">
            Πάτησε «Ενεργοποίηση μικροφώνου»
        </div>
    </div>

</div>


<script>

    /* =========================================================
       THREE.JS - 3D AVATAR
       ========================================================= */

    const container =
        document.getElementById("avatar-canvas-container");

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
        45,
        container.clientWidth / container.clientHeight,
        0.1,
        1000
    );

    const renderer =
        new THREE.WebGLRenderer({
            antialias: true,
            alpha: true
        });

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio || 1, 2)
    );

    renderer.setSize(
        container.clientWidth,
        container.clientHeight
    );

    container.appendChild(renderer.domElement);


    /* ΦΩΤΙΣΜΟΣ */

    const ambientLight =
        new THREE.AmbientLight(0xffffff, 0.9);

    scene.add(ambientLight);


    const frontLight =
        new THREE.DirectionalLight(0x38bdf8, 1.2);

    frontLight.position.set(0, 2, 5);

    scene.add(frontLight);


    const backLight =
        new THREE.PointLight(0x0284c7, 2, 10);

    backLight.position.set(0, -2, -2);

    scene.add(backLight);


    /* ΚΕΦΑΛΙ */

    const headGroup =
        new THREE.Group();


    const faceGeo =
        new THREE.SphereGeometry(
            1.3,
            32,
            32
        );

    faceGeo.scale(
        1,
        1.3,
        1.1
    );


    const faceMat =
        new THREE.MeshStandardMaterial({
            color: 0x283548,
            roughness: 0.35,
            metalness: 0.25
        });


    const faceMesh =
        new THREE.Mesh(
            faceGeo,
            faceMat
        );

    headGroup.add(faceMesh);


    /* ΑΥΤΙΑ */

    const earGeo =
        new THREE.CylinderGeometry(
            0.25,
            0.2,
            0.5,
            16
        );

    earGeo.rotateZ(
        Math.PI / 2
    );


    const earMat =
        new THREE.MeshStandardMaterial({
            color: 0x222d3d,
            roughness: 0.5
        });


    const leftEar =
        new THREE.Mesh(
            earGeo,
            earMat
        );

    leftEar.position.set(
        -1.25,
        0.1,
        0
    );

    headGroup.add(leftEar);


    const rightEar =
        new THREE.Mesh(
            earGeo,
            earMat
        );

    rightEar.position.set(
        1.25,
        0.1,
        0
    );

    headGroup.add(rightEar);


    /* ΜΑΤΙΑ */

    const eyeBgGeo =
        new THREE.SphereGeometry(
            0.22,
            16,
            16
        );

    const eyeBgMat =
        new THREE.MeshStandardMaterial({
            color: 0xffffff
        });


    const irisGeo =
        new THREE.SphereGeometry(
            0.12,
            16,
            16
        );

    const irisMat =
        new THREE.MeshStandardMaterial({
            color: 0x38bdf8,
            emissive: 0x0284c7,
            emissiveIntensity: 0.5
        });


    const leftEyeGroup =
        new THREE.Group();

    const leftEyeWhite =
        new THREE.Mesh(
            eyeBgGeo,
            eyeBgMat
        );

    const leftIris =
        new THREE.Mesh(
            irisGeo,
            irisMat
        );

    leftIris.position.z = 0.12;

    leftEyeGroup.add(
        leftEyeWhite,
        leftIris
    );

    leftEyeGroup.position.set(
        -0.45,
        0.35,
        1.05
    );

    headGroup.add(leftEyeGroup);


    const rightEyeGroup =
        new THREE.Group();

    const rightEyeWhite =
        new THREE.Mesh(
            eyeBgGeo,
            eyeBgMat
        );

    const rightIris =
        new THREE.Mesh(
            irisGeo,
            irisMat
        );

    rightIris.position.z = 0.12;

    rightEyeGroup.add(
        rightEyeWhite,
        rightIris
    );

    rightEyeGroup.position.set(
        0.45,
        0.35,
        1.05
    );

    headGroup.add(rightEyeGroup);


    /* ΦΡΥΔΙΑ */

    const browGeo =
        new THREE.BoxGeometry(
            0.4,
            0.07,
            0.1
        );

    const browMat =
        new THREE.MeshStandardMaterial({
            color: 0x1e293b
        });


    const leftBrow =
        new THREE.Mesh(
            browGeo,
            browMat
        );

    leftBrow.position.set(
        -0.45,
        0.65,
        1.15
    );

    leftBrow.rotation.z = -0.08;

    headGroup.add(leftBrow);


    const rightBrow =
        new THREE.Mesh(
            browGeo,
            browMat
        );

    rightBrow.position.set(
        0.45,
        0.65,
        1.15
    );

    rightBrow.rotation.z = 0.08;

    headGroup.add(rightBrow);


    /* ΜΥΤΗ */

    const noseGeo =
        new THREE.ConeGeometry(
            0.15,
            0.4,
            16
        );

    noseGeo.rotateX(
        Math.PI / 2
    );


    const noseMat =
        new THREE.MeshStandardMaterial({
            color: 0x222d3d,
            roughness: 0.4
        });


    const nose =
        new THREE.Mesh(
            noseGeo,
            noseMat
        );

    nose.position.set(
        0,
        0.05,
        1.25
    );

    headGroup.add(nose);


    /* ΣΤΟΜΑ */

    const mouthGeo =
        new THREE.BoxGeometry(
            0.6,
            0.12,
            0.2
        );


    const mouthMat =
        new THREE.MeshStandardMaterial({
            color: 0x0f172a,
            roughness: 0.8
        });


    const mouthMesh =
        new THREE.Mesh(
            mouthGeo,
            mouthMat
        );

    mouthMesh.position.set(
        0,
        -0.5,
        1.15
    );

    headGroup.add(mouthMesh);


    scene.add(headGroup);

    camera.position.z = 4;


    /* ANIMATION */

    const clock =
        new THREE.Clock();

    let isTalking = false;


    function animateAvatar() {

        requestAnimationFrame(
            animateAvatar
        );

        const elapsedTime =
            clock.getElapsedTime();


        headGroup.rotation.y =
            Math.sin(elapsedTime * 1.2) * 0.12;


        headGroup.rotation.x =
            Math.cos(elapsedTime * 1.0) * 0.06;


        if (isTalking) {

            mouthMesh.scale.y =
                1 +
                Math.abs(
                    Math.sin(
                        elapsedTime * 22
                    )
                ) * 3.5;

        } else {

            mouthMesh.scale.y = 1;

        }


        renderer.render(
            scene,
            camera
        );
    }


    animateAvatar();


    function resizeAvatar() {

        const width =
            container.clientWidth;

        const height =
            container.clientHeight;

        if (!width || !height) return;


        camera.aspect =
            width / height;

        camera.updateProjectionMatrix();


        renderer.setSize(
            width,
            height,
            false
        );
    }


    window.addEventListener(
        "resize",
        resizeAvatar
    );

    resizeAvatar();


    /* =========================================================
       UI / VOICE ASSISTANT
       ========================================================= */

    const messagesDiv =
        document.getElementById("messages");

    const statusText =
        document.getElementById("status-text");

    const pulseDot =
        document.getElementById("pulseDot");

    const micButton =
        document.getElementById("micButton");


    let userLocation = null;

    let isListeningActive = false;

    let isAssistantSpeaking = false;

    let commandInProgress = false;

    let conversationHistory = [];

    let recognition = null;

    let selectedVoice = null;

    let recognitionShouldRun = false;

    let restartTimer = null;


    /* =========================================================
       VOICES
       ========================================================= */

    function loadVoices() {

        const voices =
            window.speechSynthesis.getVoices();


        selectedVoice =
            voices.find(
                voice =>
                    voice.lang &&
                    voice.lang.toLowerCase().startsWith("el") &&
                    (
                        voice.name.includes("Natural") ||
                        voice.name.includes("Google")
                    )
            )
            ||
            voices.find(
                voice =>
                    voice.lang &&
                    voice.lang.toLowerCase().startsWith("el")
            )
            ||
            voices[0]
            ||
            null;
    }


    window.speechSynthesis.onvoiceschanged =
        loadVoices;

    loadVoices();


    /* =========================================================
       GEOLOCATION
       ========================================================= */

    if (navigator.geolocation) {

        navigator.geolocation.getCurrentPosition(
            position => {

                userLocation = {
                    lat: position.coords.latitude,
                    lon: position.coords.longitude
                };

            },
            () => {}
        );
    }


    /* =========================================================
       MESSAGES
       ========================================================= */

    function appendMessage(
        role,
        text
    ) {

        const className =
            role === "user"
                ? "user"
                : "assistant";


        const message =
            document.createElement("div");


        message.className =
            `message ${className}`;


        message.textContent =
            text;


        messagesDiv.appendChild(
            message
        );


        messagesDiv.scrollTop =
            messagesDiv.scrollHeight;
    }


    /* =========================================================
       STOP
       ========================================================= */

    function stopEverything() {

        window.speechSynthesis.cancel();

        isAssistantSpeaking = false;

        isTalking = false;

        isListeningActive = false;

        commandInProgress = false;

        pulseDot.classList.remove(
            "active"
        );

        statusText.innerText =
            "Περιμένω τη λέξη «Γιάννη»...";
    }


    /* =========================================================
       SPEAK
       ========================================================= */

    function speak(text) {

        window.speechSynthesis.cancel();


        isAssistantSpeaking = true;

        isTalking = true;

        pulseDot.classList.remove(
            "active"
        );


        statusText.innerText =
            "Ο Γιάννης μιλάει...";


        const utterance =
            new SpeechSynthesisUtterance(
                text
            );


        if (selectedVoice) {
            utterance.voice =
                selectedVoice;
        }


        utterance.lang =
            "el-GR";

        utterance.rate =
            1.05;

        utterance.pitch =
            1;


        const finished =
            () => {

                isAssistantSpeaking = false;

                isTalking = false;

                isListeningActive = false;

                commandInProgress = false;

                pulseDot.classList.remove(
                    "active"
                );

                statusText.innerText =
                    "Περιμένω τη λέξη «Γιάννη»...";

                micButton.classList.add(
                    "active"
                );
            };


        utterance.onend =
            finished;

        utterance.onerror =
            finished;


        window.speechSynthesis.speak(
            utterance
        );
    }


    /* =========================================================
       GREEK NORMALIZATION
       ========================================================= */

    function normalizeGreek(text) {

        return text
            .normalize("NFD")
            .replace(
                /[\u0300-\u036f]/g,
                ""
            )
            .toLowerCase()
            .replace(
                /ς/g,
                "σ"
            )
            .trim();
    }


    function removeWakeWord(text) {

        return text
            .replace(
                /\bγιαννη\b/g,
                ""
            )
            .replace(
                /\bγιαννησ\b/g,
                ""
            )
            .replace(
                /\s+/g,
                " "
            )
            .trim();
    }


    /* =========================================================
       SPEECH RECOGNITION
       ========================================================= */

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    function scheduleRecognitionRestart() {

        if (
            !recognition ||
            !recognitionShouldRun ||
            isAssistantSpeaking
        ) {
            return;
        }


        clearTimeout(
            restartTimer
        );


        restartTimer =
            setTimeout(
                () => {

                    try {

                        recognition.start();

                    } catch (error) {

                        // Ήδη ενεργό — δεν χρειάζεται κάτι.

                    }

                },
                300
            );
    }


    function startRecognition() {

        if (!recognition) return;


        recognitionShouldRun = true;


        try {

            recognition.start();

        } catch (error) {

            scheduleRecognitionRestart();

        }
    }


    function stopRecognition() {

        recognitionShouldRun = false;

        clearTimeout(
            restartTimer
        );


        if (recognition) {

            try {

                recognition.stop();

            } catch (error) {}

        }
    }


    /* =========================================================
       PROCESS COMMAND
       ========================================================= */

    async function processCommand(
        query
    ) {

        if (
            commandInProgress ||
            !query ||
            query.trim().length < 2
        ) {
            return;
        }


        commandInProgress = true;

        isListeningActive = false;


        appendMessage(
            "user",
            query
        );


        conversationHistory.push({
            role: "user",
            content: query
        });


        conversationHistory =
            conversationHistory.slice(-5);


        statusText.innerText =
            "Σκέφτομαι...";


        pulseDot.classList.remove(
            "active"
        );


        try {

            const response =
                await fetch(
                    "/api/chat",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            messages:
                                conversationHistory,

                            location:
                                userLocation
                        })
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data?.reply ||
                    "Σφάλμα server"
                );
            }


            const reply =
                String(
                    data.reply || ""
                ).trim();


            if (!reply) {

                throw new Error(
                    "Κενή απάντηση"
                );
            }


            appendMessage(
                "assistant",
                reply
            );


            conversationHistory.push({
                role: "assistant",
                content: reply
            });


            conversationHistory =
                conversationHistory.slice(-5);


            speak(reply);

        } catch (error) {

            console.error(
                "Chat error:",
                error
            );


            commandInProgress = false;

            statusText.innerText =
                "Σφάλμα σύνδεσης.";


            setTimeout(
                () => {

                    if (
                        !isAssistantSpeaking
                    ) {

                        statusText.innerText =
                            "Περιμένω τη λέξη «Γιάννη»...";
                    }

                },
                1800
            );
        }
    }


    /* =========================================================
       INITIALIZE SPEECH RECOGNITION
       ========================================================= */

    if (!SpeechRecognition) {

        micButton.disabled = true;

        micButton.innerText =
            "❌ Δεν υποστηρίζεται";

        statusText.innerText =
            "Ο browser δεν υποστηρίζει φωνητική αναγνώριση.";

    } else {

        recognition =
            new SpeechRecognition();


        recognition.lang =
            "el-GR";


        recognition.continuous =
            true;


        recognition.interimResults =
            false;


        recognition.maxAlternatives =
            1;


        recognition.onstart =
            () => {

                pulseDot.classList.add(
                    "active"
                );

                micButton.classList.add(
                    "active"
                );

                micButton.innerText =
                    "🎙️ Μικρόφωνο ενεργό";


                if (!isAssistantSpeaking) {

                    if (isListeningActive) {

                        statusText.innerText =
                            "Ενεργός — πες την ερώτησή σου...";

                    } else {

                        statusText.innerText =
                            "Περιμένω τη λέξη «Γιάννη»...";
                    }
                }
            };


        recognition.onresult =
            async event => {

                if (
                    isAssistantSpeaking ||
                    commandInProgress
                ) {
                    return;
                }


                const result =
                    event.results[
                        event.results.length - 1
                    ];


                if (
                    !result ||
                    !result.isFinal
                ) {
                    return;
                }


                const rawResult =
                    result[0]
                        .transcript
                        .trim();


                const normalized =
                    normalizeGreek(
                        rawResult
                    );


                if (
                    !normalized ||
                    normalized.length < 2
                ) {
                    return;
                }


                /* ΣΤΑΜΑΤΑ / ΣΤΟΠ */

                if (
                    /\bσταματα\b/.test(
                        normalized
                    )
                    ||
                    /\bστοπ\b/.test(
                        normalized
                    )
                ) {

                    stopEverything();

                    return;
                }


                /* WAKE WORD */

                if (!isListeningActive) {

                    const hasWakeWord =
                        /\bγιαννη\b/.test(
                            normalized
                        )
                        ||
                        /\bγιαννησ\b/.test(
                            normalized
                        );


                    if (!hasWakeWord) {
                        return;
                    }


                    isListeningActive =
                        true;


                    statusText.innerText =
                        "Ενεργός — πες την ερώτησή σου...";


                    /*

                       Υποστηρίζει και:

                       «Γιάννη τι ώρα είναι;»

                       χωρίς να χρειάζεται
                       δεύτερη φράση.

                    */

                    const cleanQuery =
                        removeWakeWord(
                            normalized
                        );


                    if (
                        cleanQuery.length > 2
                    ) {

                        await processCommand(
                            cleanQuery
                        );

                    } else {

                        pulseDot.classList.add(
                            "active"
                        );

                    }


                    return;
                }


                /*

                   Είμαστε ήδη ενεργοί.
                   Το επόμενο αποτέλεσμα
                   είναι η ερώτηση.

                */

                await processCommand(
                    rawResult
                );
            };


        recognition.onerror =
            event => {

                console.warn(
                    "SpeechRecognition error:",
                    event.error
                );


                if (
                    event.error ===
                        "not-allowed"
                    ||
                    event.error ===
                        "service-not-allowed"
                ) {

                    recognitionShouldRun =
                        false;


                    micButton.classList.remove(
                        "active"
                    );


                    statusText.innerText =
                        "Το μικρόφωνο δεν επιτρέπεται.";

                    return;
                }


                if (
                    event.error ===
                    "audio-capture"
                ) {

                    statusText.innerText =
                        "Δεν βρέθηκε διαθέσιμο μικρόφωνο.";

                    return;
                }


                if (
                    event.error ===
                    "network"
                ) {

                    statusText.innerText =
                        "Πρόβλημα δικτύου στη φωνητική αναγνώριση.";
                }


                scheduleRecognitionRestart();
            };


        recognition.onend =
            () => {

                if (
                    recognitionShouldRun &&
                    !isAssistantSpeaking
                ) {

                    scheduleRecognitionRestart();
                }
            };


        /* ΚΟΥΜΠΙ ΜΙΚΡΟΦΩΝΟΥ */

        micButton.addEventListener(
            "click",
            () => {

                if (
                    recognitionShouldRun
                ) {

                    stopRecognition();

                    micButton.classList.remove(
                        "active"
                    );

                    micButton.innerText =
                        "🎙️ Ενεργοποίηση μικροφώνου";


                    pulseDot.classList.remove(
                        "active"
                    );


                    statusText.innerText =
                        "Το μικρόφωνο είναι κλειστό.";

                } else {

                    isAssistantSpeaking =
                        false;

                    isListeningActive =
                        false;

                    commandInProgress =
                        false;


                    startRecognition();

                }
            }
        );

    }

</script>

</body>
