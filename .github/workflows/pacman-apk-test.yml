name: Mitsos Pacman APK
on:
  push:
    branches: [mitsos-pacman-20261122]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pacman-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug --no-daemon
      - name: Show APK signing certificate and checksum
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          echo "APK SHA-256:"
          sha256sum "$APK"
          echo "Signing certificate:"
          keytool -printcert -jarfile "$APK" | grep -E "Owner:|SHA256:" || true
      - uses: actions/upload-artifact@v4
        with:
          name: mitsos-pacman-apk
          path: pacman-test/app/build/outputs/apk/debug/app-debug.apk
