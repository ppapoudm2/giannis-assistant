name: Signal Explorer Android APK
on:
  push:
    branches: [wifi-bluetooth-scanner-20261122]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pacman-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: signal-explorer-apk
          path: pacman-test/app/build/outputs/apk/debug/app-debug.apk
